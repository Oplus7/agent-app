<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent App — Personal AI Agent</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --surface: #0f3460;
  --accent: #e94560;
  --text: #eaeaea;
  --dim: #8892b0;
  --tool-bg: #1a2744;
  --user-msg: #0f3460;
  --agent-msg: #1a1a2e;
  --border: #2a3a5c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
header {
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:10px 20px; display:flex; justify-content:space-between; align-items:center;
  font-size:13px;
}
header h1 { font-size:16px; font-weight:600; }
.status-dots { display:flex; gap:12px; }
.status-dot { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--dim); }
.status-dot .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
.status-dot .dot.on { background:#00c853; }
.chat { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; line-height:1.5; }
.msg.user { align-self:flex-end; background:var(--user-msg); border:1px solid var(--border); }
.msg.agent { align-self:flex-start; background:var(--agent-msg); border:1px solid var(--border); }
.msg code { font-size:12px; }
.msg pre { background:#0a0a1a; padding:8px 12px; border-radius:6px; overflow-x:auto; margin:6px 0; font-size:12px; }
.tool-block { align-self:flex-start; width:100%; max-width:85%; }
.tool-toggle {
  background:var(--tool-bg); border:1px solid var(--border); border-radius:8px;
  padding:8px 12px; cursor:pointer; font-size:12px; color:var(--dim);
  display:flex; align-items:center; gap:8px; width:100%;
}
.tool-toggle:hover { border-color:var(--accent); }
.tool-toggle .arrow { transition:transform .2s; }
.tool-toggle.open .arrow { transform:rotate(90deg); }
.tool-result {
  display:none; padding:10px 12px; margin-top:4px;
  background:#0a0a1a; border-radius:8px; font-size:12px;
  max-height:200px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
}
.tool-result.show { display:block; }
.tool-status { font-size:11px; margin-left:auto; }
.input-area {
  background:var(--panel); border-top:1px solid var(--border);
  padding:12px 20px; display:flex; gap:8px;
}
.input-area input {
  flex:1; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; color:var(--text); font-size:14px;
  outline:none;
}
.input-area input:focus { border-color:var(--accent); }
.input-area button {
  background:var(--accent); border:none; border-radius:8px;
  padding:10px 18px; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
}
.input-area button:hover { opacity:.9; }
.input-area button:disabled { opacity:.5; cursor:default; }
.empty { text-align:center; color:var(--dim); margin-top:40px; }
.empty h2 { font-size:18px; margin-bottom:6px; color:var(--text); }
.empty p { font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>Agent App</h1>
  <div class="status-dots">
    <span class="status-dot"><span class="dot" id="rag-dot"></span> RAG</span>
    <span class="status-dot"><span class="dot" id="mcp-dot"></span> ToolHub</span>
    <span class="status-dot">LLM: qwen-plus</span>
  </div>
</header>

<div class="chat" id="chat">
  <div class="empty">
    <h2>Personal AI Agent</h2>
    <p>Ask me to search your notes, read files, or answer questions.</p>
  </div>
</div>

<div class="input-area">
  <input id="input" placeholder="Type a message..." autofocus>
  <button id="send">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];

function addMessage(role, content) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = content
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/\n/g, '<br>');
  removeEmpty();
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addToolBlock(tool, args) {
  removeEmpty();
  const wrapper = document.createElement('div');
  wrapper.className = 'tool-block';

  const toggle = document.createElement('div');
  toggle.className = 'tool-toggle';
  toggle.innerHTML = `<span class="arrow">&#9654;</span> <strong>${tool}</strong> <span class="tool-status">running...</span>`;

  const result = document.createElement('div');
  result.className = 'tool-result';

  toggle.onclick = () => {
    toggle.classList.toggle('open');
    result.classList.toggle('show');
  };

  wrapper.appendChild(toggle);
  wrapper.appendChild(result);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;

  return {
    done: (status, content) => {
      toggle.querySelector('.tool-status').textContent = status || '';
      toggle.classList.add('open');
      result.classList.add('show');
      result.textContent = content ? content.slice(0, 3000) : '';
      chat.scrollTop = chat.scrollHeight;
    }
  };
}

function removeEmpty() {
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;

  addMessage('user', text);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let toolBlocks = {};
    let responseText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          switch (event.type) {
            case 'tool_call':
              toolBlocks[event.tool] = addToolBlock(event.tool, event.args);
              break;
            case 'tool_result':
              if (toolBlocks[event.tool]) {
                const preview = event.content ? event.content.slice(0, 500) : '';
                const status = preview ? `${preview.length} chars` : 'done';
                toolBlocks[event.tool].done(status, event.content);
              }
              break;
            case 'message':
              responseText = event.content;
              addMessage('agent', event.content);
              break;
            case 'error':
              addMessage('agent', `Error: ${event.content}`);
              break;
            case 'done':
              break;
          }
        } catch (e) {}
      }
    }

    history.push({ role: 'user', content: text });
    if (responseText) {
      history.push({ role: 'assistant', content: responseText });
    }
  } catch (e) {
    addMessage('agent', `Connection error: ${e.message || e}`);
  }

  sendBtn.disabled = false;
  input.focus();
}

document.getElementById('send').onclick = send;
input.onkeydown = e => { if (e.key === 'Enter') send(); };

// check status
fetch('/api/status').then(r => r.json()).then(s => {
  document.getElementById('rag-dot').className = 'dot' + (s.rag_available ? ' on' : '');
  document.getElementById('mcp-dot').className = 'dot' + (s.toolhub_available ? ' on' : '');
});
</script>
</body>
</html>
